[workspace]
resolver = "3"
members = ["crates/core", "crates/chips", "crates/board", "crates/host", "crates/api", "crates/capi", "crates/libretro"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# 速さ（OI-103、DR-105）：箱をまたいだインライン展開で、ネイティブも WebAssembly も 1 割ほど速くなる。
# panic は unwind のまま（C の ABI が catch_unwind で受ける。DR-104）
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

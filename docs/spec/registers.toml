# registers.toml：本体の番地とレジスタ（68000 から見た MMIO）の正（DR-100）。
#
# ここから `py tools/regmap/regmap.py` が次を作る。生成物は手で直さない。`--check` で作り直して突き合わせる。
#   sdk/include/fc85.inc（m68kasm）、sdk/include/fc85.h（C）、emulator/crates/board/src/regmap.rs（Rust）、
#   docs/spec/registers.md（人が読む表）
#
# 番地・幅・アクセス・ビットの名前と値はこのファイルが正。動作の説明と根拠は仕様書（hardware.md §05・§06・
# §09）と DR。食い違いを見つけたら OI にし、両方をそろえる。名前は fc85.inc から変えない（アセンブラ・C・
# Rust で同じ名前）。
#
# 形（TOML 1.0。数は 0x の 16 進で書いてよい）：
#   [meta]           title、intro（前書きの行）、rules_title・rules（アクセスの規約。1 つは文字列か行の配列）
#   [access]         アクセスの記号（r・w・rw）と意味。[when] 使える条件。[unlisted] 窓の中で表にない番地
#   [[block]]        ブロック（fc85.inc の節）。id、title、refs（根拠：§・DR・[n]）、status（D・P・O・V）、
#                    note（注釈の行）、base（{ name, addr }：ブロックの先頭の名前）、index_stride（native の
#                    レジスタの番号から番地への倍率。DOC）
#   [[block.window]] アドレスマップの窓。name、first、last（含む）、doc、unlisted（既定は berr）、when
#   [[block.region]] メモリ。name、addr、bytes、end（終わりの次の番地の名前）、access、width（any：byte と語、
#                    word：語だけ、upper：上位バイトレーン）、within（含まれる領域）、when、doc。
#                    within のない領域は、それ自身がアドレスマップの窓になる
#   [block.bank]     同じ並びのレジスタの組（Data Fabric のチャネル）。title、names（組の先頭の名前）、addr、
#                    stride、stride_name、reserved（窓に取ってある組の数）、doc。[[block.bank.reg]] は offset で置く
#   [[block.reg]]    レジスタ。name、addr（絶対番地）か index（native の番号）か offset（bank の中）、bits（8：
#                    上位バイトレーンの 1 byte、16：語、32：2 語）、access、count・stride（並び。stride の既定は
#                    2）、low（32 bit の下位語の名前）、w1c（W1C のビット）、read_effect（読むと変わること）、
#                    when、status、refs、doc
#   [[block.group]]  定数のまとまり。title、note、of（どのレジスタのものか）、kind（mask・bit・value・number）、
#                    width（8・16・32：C と Rust の型）、digits（fc85.inc の 16 進の桁。0 は 10 進）、status、
#                    refs、items（{ name, value か expr, doc, kind, digits }。expr は前に出た名前と | + - * << &）
#   doc と note は文字列か行の配列。fc85.inc では doc の 2 行目から続きの注釈の行になる。

[meta]
title = "本体の番地とレジスタ（68000 から見た MMIO）"
intro = [
  "番地・幅・アクセス・ビットの名前と値は docs/spec/registers.toml が正（DR-100）。仕様書（docs/spec/hardware.md）",
  "§05 のアドレスマップ、§06 の Data Fabric、§09 の入力と、DR-016・DR-019・DR-025・DR-027・DR-028・DR-029・",
  "DR-046・DR-053・DR-055 から書き起こした。動作の説明と根拠は仕様書と DR。食い違えば OI にしてそろえる。",
  "記述ステータスは節と見出しの印に従う（ほとんど [P]）。",
]
rules_title = "アクセスの規約（仕様書 §05、DR-016・DR-030・DR-033・DR-052・DR-053）："
rules = [
  "16 bit のレジスタは語アクセスだけ。バイトのアクセスはバスエラー。",
  "8 bit の IC（DOC、ACIA、文字 ROM）は上位バイトレーン（偶数番地）。MOVE.B で偶数番地を使う。",
  "未割当の番地はバスエラー（64 クロックの時間切れ）。",
  [
    "ROM と読出し専用のレジスタへの書込みは捨て、書込み専用のレジスタは読むと 0（同じ番地にもう一方の向きの",
    "レジスタがあれば、そのレジスタを読み書きする）。",
  ],
  "ACRTC の AR/SR とデータポート、DOC の窓には、CLR・TAS・BSET などの読み書き一体の命令を使わない。",
  "ACRTC の FIFO には、SR の WFR（書込み）・RFR（読出し）を確かめてからアクセスする。",
  [
    "DOC の 0xE0・0xE2 は読むと状態が変わる。0xE0 は DOC の割込みを受ける処理（BIOS の既定の処理か、ベクタ 28 を",
    "書き換えたアプリ）だけが割込み 1 回につき 1 回読み、0xE2 は A/D 変換の手順でだけ読む（DR-123）。",
  ],
]

[access]
r = "読出し。書込みはバスエラーにならない（ROM と I/O のレジスタは捨てる。DR-052、DR-053）"
w = "書込み。読出しはバスエラーにならない（I/O のレジスタは 0 が読める。DR-046、DR-053）"
rw = "読み書き"

[when]
always = "いつでも"
doc = "DOC の子基板がある（FABRIC_MODULES の bit 2）。ないと窓はバスエラー（DR-019）"
no_doc = "DOC の子基板がない。あると窓はバスエラー（DR-019）"
dsp_prgbus = "DSP をリセットし PRGBUS＝1 の間。ほかはバスエラー（DR-029）"
cart = "カートリッジが差してある（INPUT_IRQ_STATUS の bit 4）。ないと窓はバスエラー（DR-095）"

[unlisted]
berr = "表にない番地はバスエラー（DR-052、DR-053）"
chip = "窓の中の番地はすべて IC に届く（DOC のネイティブのレジスタ 256 個）"

# ---------------------------------------------------------------------------------------------- メモリ

[[block]]
id = "memory"
title = "メモリ"
refs = ["§05"]
status = "P"

[[block.region]]
name = "BOOT_ROM"
addr = 0x000000
bytes = 0x10000
access = "r"
width = "any"
doc = "64 KiB"

[[block.region]]
name = "CHAR_ROM"
addr = 0x010000
bytes = 0x10000
access = "r"
width = "upper"
refs = ["DR-031"]
doc = "文字 ROM。ROM の offset n は CHAR_ROM+2n（上位レーン）"

[[block.region]]
name = "MAIN_RAM"
addr = 0x100000
bytes = 0x20000
end = "MAIN_RAM_END"
access = "rw"
width = "any"
doc = "128 KiB"

[[block.region]]
name = "JUMP_TABLE"
addr = 0x100000
bytes = 0x600
end = "JUMP_TABLE_END"
access = "rw"
width = "any"
within = "MAIN_RAM"
doc = "例外のジャンプ表。ベクタ n は JUMP_TABLE+6n（JMP abs.L）（DR-025）"

[[block.region]]
name = "STAGING"
addr = 0x120000
bytes = 0x10000
end = "STAGING_END"
access = "rw"
width = "any"
doc = "64 KiB の AV staging RAM（Fabric の port 0）"

[[block.region]]
name = "CART"
addr = 0x400000
bytes = 0x100000
end = "CART_END"
access = "r"
width = "any"
when = "cart"
doc = "カートリッジの窓（最大 1 MiB）。なければバスエラー"

# ---------------------------------------------------------------------------------------------- ACRTC


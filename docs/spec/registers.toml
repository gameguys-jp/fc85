first = 0x200000
last = 0x200003
doc = "ACRTC のホストの口：+0 AR（書込み）・SR（読出し）、+2 データ"

[[block.reg]]
name = "ACRTC_AR"
addr = 0x200000
bits = 16
access = "w"
doc = "書込み：AR（レジスタの番号）"

[[block.reg]]
name = "ACRTC_SR"
addr = 0x200000
bits = 16
access = "r"
doc = "読出し：SR（上位バイトは 1）"

[[block.reg]]
name = "ACRTC_DATA"
addr = 0x200002
bits = 16
access = "rw"
read_effect = "r00 では読出し FIFO から 1 語を取る"
doc = "AR が指すレジスタ。r00 は FIFO"

